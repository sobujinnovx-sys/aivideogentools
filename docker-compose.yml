version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: aivideo_secret
      POSTGRES_DB: aivideo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aivideo:aivideo_secret@postgres:5432/aivideo_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      STORAGE_TYPE: local
      STORAGE_PATH: /app/storage
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aivideo:aivideo_secret@postgres:5432/aivideo_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      STORAGE_TYPE: local
      STORAGE_PATH: /app/storage
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: rq worker high default low --url redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
  storage_data:
